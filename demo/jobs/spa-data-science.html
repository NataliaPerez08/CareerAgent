<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DataLoop · Data Scientist</title>
  <meta property="og:title" content="Data Scientist">
  <meta property="og:site_name" content="DataLoop">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
    main { border: 1px solid #ddd; border-radius: 8px; padding: 20px 28px 28px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    #job-meta { margin: 0 0 16px; color: #666; }
    h3 { margin: 20px 0 8px; font-size: 1rem; }
    ul { margin: 0 0 12px; padding-left: 22px; }
  </style>
</head>
<body>
  <main>
    <h1 id="job-title">Loading DataLoop careers…</h1>
    <p id="job-meta"></p>
    <div id="job-content"></div>
  </main>

  <script id="data-job" type="text/template">{"id": 9042, "title": "Data Scientist", "location": {"name": "Remote"}, "company": "DataLoop", "content": "<p>We turn product events into reliable metrics. You will design the pipelines and the dashboards the whole company reads.</p>\n<h3>Requirements</h3>\n<ul>\n<li>Python for analysis and pipeline code.</li>\n<li>SQL for warehousing and reporting.</li>\n<li>Data modelling and schema design.</li>\n</ul>\n<h3>Preferred</h3>\n<ul>\n<li>dbt or similar transformation tools.</li>\n<li>BI dashboards (Looker, Superset).</li>\n</ul>\n<p>Remote-friendly team, small and senior.</p>"}</script>
  <script type="text/javascript">
    (function () {
      var raw = document.getElementById("data-job").textContent;
      if (!raw) return;
      var job;
      try {
        job = JSON.parse(raw);
      } catch (e) {
        return;
      }
      if (job.title) {
        document.title = (job.company ? job.company + " \u00b7 " : "") + job.title;
        document.getElementById("job-title").textContent = job.title;
      }
      var location = job.location && job.location.name;
      var meta = document.getElementById("job-meta");
      if (meta && (job.company || location)) {
        meta.textContent = [job.company, location].filter(Boolean).join(" \u00b7 ");
      }
      if (job.content) {
        document.getElementById("job-content").innerHTML = job.content;
      }
    })();
  </script>
</body>
</html>
